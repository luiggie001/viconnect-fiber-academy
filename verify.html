<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Certificate - Viconnect Fiber Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-50">

<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-sky-600 text-slate-900 flex items-center justify-center font-bold text-lg border border-sky-300/50">
        VFA
      </div>
      <div>
        <h1 class="font-semibold text-lg">Viconnect Fiber Academy</h1>
        <p class="text-[11px] text-slate-400">Hybrid Fiber Optic Training · Bilingual</p>
      </div>
    </a>

    <nav class="hidden md:flex gap-6 text-sm font-semibold">
      <a href="index.html" class="hover:text-sky-400">Home</a>
      <a href="courses.html" class="hover:text-sky-400">Courses</a>
      <a href="schedule.html" class="hover:text-sky-400">Schedule</a>
      <a href="verify.html" class="hover:text-sky-400">Verify</a>
      <a href="contact.html" class="hover:text-sky-400">Contact</a>
    </nav>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-16">

  <h2 class="text-3xl font-semibold mb-4">Verify Certificate</h2>
  <p class="text-slate-300 mb-8">
    EN: Enter the certificate number from your printed PDF.<br>
    ES: Ingrese el número del certificado de su PDF impreso.
  </p>

  <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-6">
    <label class="block text-sm font-medium mb-2">Certificate Number / Número de Certificado</label>
    <input id="certInput" type="text"
      class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 outline-none focus:border-sky-400"
      placeholder="Example: VFA-2025-00123">
    
    <button onclick="verifyCert()"
      class="w-full mt-4 bg-sky-600 hover:bg-sky-500 py-3 rounded-lg font-semibold">
      Verify / Verificar
    </button>

    <p id="result" class="mt-4 text-center text-sm"></p>
  </div>

</main>

<footer class="mt-16 py-8 border-t border-slate-800 text-center text-sm text-slate-400">
  © 2025 Viconnect Fiber Academy
</footer>

<script>
function verifyCert() {
  let c = document.getElementById("certInput").value.trim();
  let result = document.getElementById("result");

  if (!c) {
    result.textContent = "Enter a certificate number / Ingrese un número de certificado.";
    result.className = "mt-4 text-center text-red-400";
    return;
  }

  if (c.startsWith("VFA-")) {
    result.textContent = "✔ VALID — Certificate exists in system.";
    result.className = "mt-4 text-center text-green-400";
  } else {
    result.textContent = "✘ INVALID — Certificate not found.";
    result.className = "mt-4 text-center text-red-400";
  }
}
</script>

</body>
</html>
