<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Certificate - Viconnect Fiber Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-50">

<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-sky-500/20 border border-sky-400/40 flex items-center justify-center text-xs font-bold">
        VFA
      </div>
      <div>
        <div class="font-semibold text-slate-50 text-lg">Viconnect Fiber Academy</div>
        <div class="text-xs text-slate-400">Hybrid Fiber Optic Training · Bilingual</div>
      </div>
    </a>

    <nav class="flex gap-4 text-sm">
      <a href="index.html" class="hover:text-sky-400">Home</a>
      <a href="courses.html" class="hover:text-sky-400">Courses</a>
      <a href="schedule.html" class="hover:text-sky-400">Schedule</a>
      <a href="certificate.html" class="hover:text-sky-400">Certificates</a>
      <a href="verify.html" class="text-sky-400">Verify Certificate</a>
      <a href="contact.html" class="hover:text-sky-400">Contact</a>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-12">

  <h1 class="text-3xl font-bold mb-3">Verify Student Certificate</h1>
  <p class="text-sm text-slate-300 mb-6">
    Enter the certificate ID to confirm authenticity.
    <br>
    Ingrese el ID del certificado para confirmar su autenticidad.
  </p>

  <div class="border border-slate-800 bg-slate-900/60 rounded-xl p-6 max-w-lg">
    
    <label class="block text-sm mb-2 text-slate-300 font-semibold">Certificate ID</label>
    <input id="certID" type="text" placeholder="Ex: VFA-2024-00123"
           class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm outline-none focus:border-sky-400">

    <button onclick="verifyCertificate()" 
            class="w-full mt-4 px-4 py-2 bg-sky-600 hover:bg-sky-500 rounded-lg text-sm font-semibold">
      Verify / Verificar
    </button>

    <!-- RESULT BOX -->
    <div id="result" class="mt-6 hidden p-4 rounded-lg border"></div>

  </div>

</main>

<script>
// SAMPLE DATABASE FOR NOW — YOU CAN EXPAND ANYTIME
const certificates = {
  "VFA-2024-001": {
    name: "Angel Rodriguez",
    course: "Fiber Optic Technician (FOT)",
    date: "Jan 2024"
  },
  "VFA-2024-002": {
    name: "John Doe",
    course: "Fiber Splicing Technician",
    date: "Feb 2024"
  }
};

function verifyCertificate() {
  const id = document.getElementById("certID").value.trim();
  const result = document.getElementById("result");

  if (certificates[id]) {
    const data = certificates[id];
    result.innerHTML = `
      <p class="font-bold text-emerald-400 text-lg mb-2">✔ Valid Certificate</p>
      <p><strong>Student:</strong> ${data.name}</p>
      <p><strong>Course:</strong> ${data.course}</p>
      <p><strong>Completion:</strong> ${data.date}</p>
      <p class="mt-2 text-slate-400 text-xs">Viconnect Fiber Academy</p>
    `;
    result.className = "mt-6 p-4 rounded-lg border border-emerald-500 bg-emerald-500/10";
  } else {
    result.innerHTML = `
      <p class="font-bold text-red-400 text-lg mb-2">✘ Certificate NOT found</p>
      <p class="text-sm text-slate-300">Please check the ID and try again.</p>
    `;
    result.className = "mt-6 p-4 rounded-lg border border-red-500 bg-red-500/10";
  }

  result.classList.remove("hidden");
}
</script>

</body>
</html>
