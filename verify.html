<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Certificate – Viconnect Fiber Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-200">

<!-- HEADER -->
<header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
        
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <div class="bg-blue-500 px-3 py-1 rounded-lg font-bold text-xl text-white">VFA</div>
            <div class="text-lg font-semibold">Viconnect Fiber Academy</div>
        </div>

        <!-- Mobile menu button -->
        <button 
            onclick="document.getElementById('mobileMenu').classList.toggle('hidden')"
            class="md:hidden bg-gray-700 px-3 py-2 rounded-lg">
            MENU
        </button>

        <!-- Desktop menu -->
        <nav class="hidden md:flex space-x-6 text-gray-300">
            <a href="index.html" class="hover:text-blue-400">Home</a>
            <a href="courses.html" class="hover:text-blue-400">Courses</a>
            <a href="enrollment.html" class="hover:text-blue-400">Enroll</a>
            <a href="verify.html" class="text-blue-400 font-semibold">Verify Certificate</a>
            <a href="contact.html" class="hover:text-blue-400">Contact</a>
        </nav>
    </div>

    <!-- Mobile Dropdown -->
    <nav id="mobileMenu" class="hidden md:hidden bg-gray-800 border-t border-gray-700 p-4 space-y-3">
        <a href="index.html" class="block hover:text-blue-400">Home</a>
        <a href="courses.html" class="block hover:text-blue-400">Courses</a>
        <a href="enrollment.html" class="block hover:text-blue-400">Enroll</a>
        <a href="verify.html" class="block text-blue-400 font-semibold">Verify Certificate</a>
        <a href="contact.html" class="block hover:text-blue-400">Contact</a>
    </nav>
</header>

<!-- MAIN CONTENT -->
<section class="max-w-xl mx-auto p-6 mt-10">
    <h1 class="text-3xl font-bold text-blue-400 mb-4">Certificate Verification</h1>
    <p class="text-gray-300 mb-6">
        Enter a Certificate ID below to verify completion of a Viconnect Fiber Academy training program.
    </p>

    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
        <label class="block text-sm text-gray-400 mb-2">Certificate ID</label>
        <input id="certID" 
               class="w-full px-4 py-2 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:outline-none"
               placeholder="e.g., VFA-FOT-2025-00123" />

        <button onclick="verifyCert()"
                class="w-full mt-4 bg-blue-500 hover:bg-blue-600 py-2 rounded-lg font-semibold text-white">
            Verify Certificate
        </button>

        <div id="result" class="mt-6"></div>
    </div>
</section>

<script>
function verifyCert() {
    const id = document.getElementById("certID").value.trim();
    const result = document.getElementById("result");

    if (!id) {
        result.innerHTML = `
            <p class="text-red-400 text-sm mt-3">Please enter a certificate ID.</p>
        `;
        return;
    }

    // Placeholder result — you will connect real FOA backend later
    result.innerHTML = `
        <div class="mt-4 p-4 bg-gray-800 border border-gray-700 rounded-xl text-sm text-gray-300">
            <p class="font-semibold text-blue-400 mb-1">Verification Submitted</p>
            <p>This certificate ID will be manually verified by the academy.</p>
            <p class="text-gray-400 mt-1 text-xs">
                Real-time verification will be enabled after FOA accreditation.
            </p>
        </div>
    `;
}
</script>

<!-- FOOTER -->
<footer class="text-center py-6 mt-12 text-gray-500 text-sm border-t border-gray-800">
    © 2025 Viconnect Fiber Academy. All rights reserved.
</footer>

</body>
</html>
