<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Completion - ViConnect Fiber Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

    <main class="max-w-4xl mx-auto p-6">

        <h1 class="text-3xl font-bold text-center mb-6 text-emerald-400">
            Certificate of Completion
        </h1>

        <p class="text-center text-gray-300 mb-4">
            Congratulations! Below is a sample certificate issued by ViConnect Fiber Academy.
        </p>

        <div class="flex justify-center mb-6">
            <img src="assets/certificate-preview.png" 
                 alt="Certificate Preview"
                 class="rounded-lg shadow-lg border border-gray-700">
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-6">
            
            <a href="assets/certificate-preview.png" 
               download
               class="px-5 py-3 bg-emerald-500 hover:bg-emerald-600 rounded-lg font-semibold text-center">
               Download Certificate
            </a>

            <a href="verify.html"
               class="px-5 py-3 bg-blue-500 hover:bg-blue-600 rounded-lg font-semibold text-center">
               Verify Certificate
            </a>

        </div>

    </main>

</body>
</html>
